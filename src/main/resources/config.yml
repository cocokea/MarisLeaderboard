update-checker: true

gui:
  main:
    title: "ʟᴇᴀᴅᴇʀʙᴏᴀʀᴅ"
    rows: 3
  board:
    title: "{category} (Page {page})"
    rows: 6

settings:
  refresh-ticks: 600
  async-threads: 1
  max-search-results: 45
  placeholders:
    money: "%vault_eco_balance%"
    deaths: "%statistic_deaths%"
    playtime: "%plan_player_time_total%"
    place: "%mariscoreprotect_blocks_placed_formatted%"
    broke: "%mariscoreprotect_blocks_broken_formatted%"
    mobs: "%statistic_mob_kills%"
  category-meta:
    money:
      display-name: "ᴍᴏsᴛ ᴍᴏɴᴇʏ"
      compact: true
    deaths:
      display-name: "ᴍᴏsᴛ ᴅᴇᴀᴛʜs"
      compact: true
    playtime:
      display-name: "ᴍᴏsᴛ ᴘʟᴀʏᴛɪᴍᴇ"
      compact: true
    place:
      display-name: "ᴍᴏsᴛ ʙʟᴏᴄᴋs ᴘʟᴀᴄᴇᴅ"
      compact: true
    broken:
      display-name: "ʙʟᴏᴄᴋs ʙʀᴏᴋᴇɴ"
      compact: true
    mobs:
      display-name: "ᴍᴏsᴛ ᴍᴏʙs ᴋɪʟʟᴇᴅ"
      compact: true
  format:
    number-short-enabled: true
    number-decimals: 1
    time-use-placeholder-value: true
    thousands-short:
      1000: K
      1000000: M
      1000000000: B
      1000000000000: T

menu-items:
  categories:
    money:
      slot: 10
      material: EMERALD
      name: "&#00FFAAᴍᴏɴᴇʏ ʟᴇᴀᴅᴇʀʙᴏᴀʀᴅ"
      lore:
        - "&fClick to view the ᴍᴏɴᴇʏ leaderboard"
    deaths:
      slot: 11
      material: SKELETON_SKULL
      name: "&#00FFAAᴅᴇᴀᴛʜꜱ ʟᴇᴀᴅᴇʀʙᴏᴀʀᴅ"
      lore:
        - "&fClick to view the ᴅᴇᴀᴛʜꜱ leaderboard"
    playtime:
      slot: 12
      material: CLOCK
      name: "&#00FFAAᴘʟᴀʏᴛɪᴍᴇ ʟᴇᴀᴅᴇʀʙᴏᴀʀᴅ"
      lore:
        - "&fClick to view the ᴘʟᴀʏᴛɪᴍᴇ leaderboard"
    place:
      slot: 13
      material: STONE
      name: "&#00FFAAʙʟᴏᴄᴋs ᴘʟᴀᴄᴇᴅ ʟᴇᴀᴅᴇʀʙᴏᴀʀᴅ"
      lore:
        - "&fClick to view the ʙʟᴏᴄᴋs ᴘʟᴀᴄᴇᴅ leaderboard"
    broke:
      slot: 14
      material: COBBLESTONE
      name: "&#00FFAAʙʟᴏᴄᴋs ʙʀᴏᴋᴇɴ ʟᴇᴀᴅᴇʀʙᴏᴀʀᴅ"
      lore:
        - "&fClick to view the ʙʟᴏᴄᴋs ʙʀᴏᴋᴇɴ leaderboard"
    mobs:
      slot: 15
      material: ZOMBIE_HEAD
      name: "&#00FFAAᴍᴏʙs ᴋɪʟʟᴇᴅ ʟᴇᴀᴅᴇʀʙᴏᴀʀᴅ"
      lore:
        - "&fClick to view the ᴍᴏʙs ᴋɪʟʟᴇᴅ leaderboard"
  previous-page:
    slot: 45
    material: ARROW
    name: "&#00FFAAʙᴀᴄᴋ"
    lore:
      - "&fClick to go to the previous page"
  next-page:
    slot: 53
    material: ARROW
    name: "&#00FFAAɴᴇxᴛ"
    lore:
      - "&fClick to go to next page"
  self:
    slot: 48
    name: "&#00FFAA{player}"
    lore:
      - "&f{category}: &7{value} &#00FFAA(#{rank})"
  refresh:
    slot: 49
    name: "&#00FFAA{category}"
    lore:
      - "&fClick to refresh!"
  search:
    slot: 50
    material: OAK_SIGN
    name: "&#00FFAAsᴇᴀʀᴄʜ"
    lore:
      - "&fClick to search for players"
  entry:
    name: "&#00FFAA{player}"
    lore:
      - "&f{category}: &7{value} &#00FFAA(#{rank})"

search:
  timeout-seconds: 60
  sign-lines:
    - ""
    - '§0↑↑↑↑↑↑↑↑↑↑↑↑'
    - "§0Search"
    - ""

messages:
  reload: "&aĐã reload MarisLeaderboard."
  no-permission: "&cBạn không có quyền dùng lệnh này."
  player-only: "&cChỉ người chơi mới dùng được lệnh này."

database:
  type: SQLITE
  table: maris_leaderboard_data
  sqlite:
    file: plugins/MarisLeaderboard/data.db
  mysql:
    host: 127.0.0.1
    port: 3306
    database: marisleaderboard
    username: root
    password: password
    parameters: "useSSL=false&characterEncoding=utf8&serverTimezone=UTC"
  hikari:
    pool-name: MarisLeaderboardPool
    maximum-pool-size: 4
    minimum-idle: 1
    max-lifetime: 1800000
    keepalive-time: 0
    connection-timeout: 10000
    validation-timeout: 5000
    leak-detection-threshold: 0

performance:
  batch-size: 100
  use-cache: true
  cache-top-size: 200
  cache-search-size: 100
  update-on-join: true
  update-on-quit: true
  update-on-command-open: true
  debounce-click-ms: 150
  cancel-bottom-inventory-click: false
  cancel-double-click: false
  cancel-drag: false
  block-shift-move: false
  packet-guard-enabled: false
  packet-guard-debug: false
