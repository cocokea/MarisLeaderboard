name: MarisLeaderboard
version: '1.0'
main: com.maris7.leaderboard.MarisLeaderboardPlugin
api-version: '1.21'
folia-supported: true
authors: [OpenAI]
softdepend: [PlaceholderAPI, Vault, packetevents]
libraries:
  - com.zaxxer:HikariCP:7.0.2
  - org.xerial:sqlite-jdbc:3.53.0.0
  - com.mysql:mysql-connector-j:9.7.0
commands:
  leaderboard:
    description: Open MarisLeaderboard or reload the plugin.
    usage: /leaderboard [reload]
    aliases: [lb, marisleaderboard]
permissions:
  marisleaderboard.reload:
    default: op
